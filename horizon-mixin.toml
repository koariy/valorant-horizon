[mod]
id = "valorant_horizon"
version = "0.3.0-dev.4"

[compatibility]
horizon_revision = "41f822b659789780f58d32c63ddfb6887ea1b8bf"

[[crate]]
id = "engine"
path = "engine"

[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "helpers/key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "client_tick_post"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_tick_post"
kind = "HEAD"
helper = "helpers/client_tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "helpers/hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut crate::hud::HudBatch", value = "batch" },
  { name = "corners", ty = "&mut crate::extras_hud::Corners", value = "corners" },
]

